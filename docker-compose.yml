version: '3.8'

services:
  dind:
    image: docker:dind-rootless
    environment:
      - DOCKER_TLS_CERTDIR=/certs
    volumes:
      - dind-certs:/certs/client
      - dind-data:/var/lib/docker
    ports:
      - "8080-8090:8080-8090"
    networks:
      - mcp-gateway
    healthcheck:
      test: ["CMD", "docker", "--tlsverify", "--tlscacert=/certs/client/ca.pem", "--tlscert=/certs/client/cert.pem", "--tlskey=/certs/client/key.pem", "-H=tcp://localhost:2376", "info"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    shm_size: 1gb  # Chromium requires at least 1GB shared memory for E2E tests
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NODE_ENV=development
    depends_on:
      - backend
    networks:
      - mcp-gateway
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    working_dir: /workspace/backend
    ports:
      - "8000:8000"
    volumes:
      - ./:/workspace
      - ./data:/app/data
      - ./backend:/app
      - dind-certs:/certs/client:ro
      - "bw-cli-config:/root/.config/Bitwarden CLI"
      - "bw-cli-cache:/root/.cache/Bitwarden CLI"
    environment:
      - BITWARDEN_CLI_PATH=/usr/local/bin/bw
      - DOCKER_HOST=tcp://dind:2376
      - DOCKER_TLS_VERIFY=1
      - DOCKER_CERT_PATH=/certs/client
      - SESSION_TIMEOUT_MINUTES=30
      - CATALOG_CACHE_TTL_SECONDS=3600
      - CORS_ORIGINS=http://localhost:3000,http://localhost:3001
      - OAUTH_AUTHORIZE_URL=${OAUTH_AUTHORIZE_URL:-https://auth.example.com/authorize}
      - OAUTH_TOKEN_URL=${OAUTH_TOKEN_URL:-https://auth.example.com/token}
      - OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID:-mcp-console}
      - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET:-}
      - OAUTH_REDIRECT_URI=${OAUTH_REDIRECT_URI:-http://localhost:8000/api/catalog/oauth/callback}
      - OAUTH_ALLOW_OVERRIDE=${OAUTH_ALLOW_OVERRIDE:-true}
      - OAUTH_TOKEN_ENCRYPTION_KEY=${OAUTH_TOKEN_ENCRYPTION_KEY:-}
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
      - HOME=/root
    depends_on:
      dind:
        condition: service_healthy
    networks:
      - mcp-gateway
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  mcp-gateway:
    driver: bridge

volumes:
  dind-certs:
  dind-data:
  bw-cli-config:
  bw-cli-cache:
  data-volume:
