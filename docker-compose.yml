version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    shm_size: 1gb  # Chromium requires at least 1GB shared memory for E2E tests
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:${BACKEND_PORT:-8000}
      - NODE_ENV=development
    depends_on:
      - backend
    networks:
      - mcp-gateway
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    working_dir: /workspace/backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./:/workspace
      - ./data:/app/data
      - ./backend:/app
      - "${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock"
      - ./data/bw-configs:/home/appuser/.config/Bitwarden CLI
      - ./data/bw-cache:/home/appuser/.cache/Bitwarden CLI
      - "${HOST_DOTFILES_DIR:-/home/y_ohi/dotfiles}:/mnt/host_dotfiles"
    environment:
      - BITWARDEN_CLI_PATH=/usr/local/bin/bw
      - DOCKER_HOST=unix:///var/run/docker.sock
      - DOCKER_TLS_VERIFY=0
      - SESSION_TIMEOUT_MINUTES=30
      - CATALOG_CACHE_TTL_SECONDS=3600
      - CORS_ORIGINS=http://localhost:${FRONTEND_PORT:-3000}
      - OAUTH_AUTHORIZE_URL=${OAUTH_AUTHORIZE_URL:-https://auth.example.com/authorize}
      - OAUTH_TOKEN_URL=${OAUTH_TOKEN_URL:-https://auth.example.com/token}
      - OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID:-mcp-console}
      - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET:-}
      - OAUTH_REDIRECT_URI=${OAUTH_REDIRECT_URI:-http://localhost:${BACKEND_PORT:-8000}/api/catalog/oauth/callback}
      - OAUTH_ALLOW_OVERRIDE=${OAUTH_ALLOW_OVERRIDE:-true}
      - OAUTH_TOKEN_ENCRYPTION_KEY=${OAUTH_TOKEN_ENCRYPTION_KEY:-}
      - OAUTH_TOKEN_ENCRYPTION_KEY_FILE=/app/data/oauth_encryption.key
      - STATE_DB_PATH=/app/data/state.db
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
      - HOME=/home/appuser
    group_add:
      - "${DOCKER_GID:-995}"
    networks:
      - mcp-gateway
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  mcp-gateway:
    driver: bridge

volumes:
  data-volume:
