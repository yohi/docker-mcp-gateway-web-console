[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
  "ignore:.*asyncio\\.iscoroutinefunction.*:DeprecationWarning:pytest_asyncio.*",
  "ignore:.*asyncio\\.get_event_loop_policy.*:DeprecationWarning:pytest_asyncio.*",
  "ignore:.*asyncio\\.set_event_loop_policy.*:DeprecationWarning:pytest_asyncio.*",
]

[tool.black]
line-length = 100
target-version = ['py314']

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
# 基本的なリンター設定
select = ["E", "F", "B", "S", "I"]

[tool.ruff.lint.per-file-ignores]
# S101: Use of assert detected (pytestのテストコードでは標準的なため無視)
"tests/*" = ["S101"]

[tool.bandit]
# B101/S101: assert_used (pytestのテストコードでは標準的なため除外)
skips = ["B101"]

[tool.mypy]
python_version = "3.14"

[tool.isort]
profile = "black"
line_length = 100
